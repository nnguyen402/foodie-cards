project_id = "foodie-cards"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "foodiecards://"
additional_redirect_urls = ["http://localhost:8081", "exp://127.0.0.1:8081"]
enable_signup = true

[auth.email]
enable_signup = true
